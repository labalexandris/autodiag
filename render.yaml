services:
  - type: web
    name: autodiag
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Τα mock δεδομένα και οι ώρες υπολογίζονται σε ώρα Ελλάδας
      - key: TZ
        value: Europe/Athens
      # Κωδικός εισόδου στο /admin: ορίζεται στο dashboard του Render, όχι εδώ
      - key: ADMIN_PASSWORD
        sync: false
      # Μελλοντικά (Neon):
      # - key: DATABASE_URL
      #   sync: false
